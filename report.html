<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:20px;
        }

        .container{
            width:90%;
            margin:auto;
        }

        h2{
            text-align:center;
            color:#007BFF;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
        }

        th, td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

        th{
            background:#007BFF;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        a{
            text-decoration:none;
            color:#007BFF;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Attendance Report</h2>

<table>
    <tr>
        <th>Student Name</th>
        <th>Roll Number</th>
        <th>Department</th>
        <th>Date</th>
        <th>Status</th>
    </tr>

    {% if records %}
        {% for row in records %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
        </tr>
        {% endfor %}
    {% else %}
        <tr>
            <td colspan="5">No attendance records found.</td>
        </tr>
    {% endif %}

</table>

<br>

<a href="/dashboard">⬅ Back to Dashboard</a>

</div>

</body>
</html>
